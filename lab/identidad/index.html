<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lab de identidad</title>
  <script>
    // la vista vieja (§A–§C) sigue disponible para el analista, sin link en la pantalla
    if (new URLSearchParams(location.search).get("modo") === "experto") location.replace("/lab/experto.html");
  </script>
  <link rel="stylesheet" href="/lab/lab.css" />
  <link rel="stylesheet" href="/lab/lab_foto.css" />
</head>
<body class="foto-mode">
  <header class="top">
    <h1>Laboratorio de identidad <span class="sub" id="cap-label"></span></h1>
    <span class="status" id="status">cargando…</span>
  </header>

  <main class="fcols">
    <!-- Izquierda: la foto -->
    <section class="fleft">
      <div class="fhead">
        <div class="ftitle"><b id="f-num">FOTO –</b> <span id="f-range" class="tc"></span></div>
        <div class="fnav">
          <button id="f-prev" class="btn ghost big">◀ Anterior</button>
          <button id="f-next" class="btn ghost big">Siguiente ▶</button>
        </div>
      </div>
      <div class="player-wrap">
        <hyperframes-player id="player"></hyperframes-player>
        <audio id="narr" src="/media/audio" preload="auto"></audio>
      </div>
      <div class="ftransport">
        <button id="btn-play" class="btn big">▶ Play esta foto</button>
        <span id="tc" class="tc"></span>
        <span id="now-line" class="now-line"></span>
      </div>
      <div class="fvoice">
        <div class="flabel">La voz dice aquí:</div>
        <p id="f-words" class="fwords"></p>
      </div>
      <div id="f-dots" class="fdots" aria-label="Progreso"></div>
    </section>

    <!-- Derecha: objetos de esta foto -->
    <section class="fright">
      <h2>Objetos de esta foto</h2>
      <div id="f-objs" class="fobjs"></div>
      <div class="fadd">
        <button id="f-add" class="btn ghost big">+ Agregar algo a esta foto ▾</button>
        <div id="f-add-list" class="fadd-list" hidden></div>
      </div>
    </section>
  </main>

  <footer class="bar">
    <button id="btn-full" class="btn big">▶ Ver capítulo completo</button>
    <button id="btn-render" class="btn ghost" disabled title="Llega en §D">🎬 Render mp4</button>
    <span class="spacer"></span>
    <button id="btn-save" class="btn">💾 Guardar identidad</button>
    <button id="btn-summary" class="btn ghost">📄 Resumen</button>
    <button id="btn-undo" class="btn ghost" title="Deshacer (Ctrl+Z)">↶</button>
    <button id="btn-redo" class="btn ghost" title="Rehacer (Ctrl+Shift+Z)">↷</button>
  </footer>

  <aside id="summary" class="summary" hidden>
    <div class="summary-head"><b>Resumen para el analista</b> <span class="tech">IDENTIDAD_misterio.md · se actualiza solo</span>
      <span class="spacer"></span><button id="summary-copy" class="btn sm ghost">Copiar</button>
      <button id="summary-close" class="btn sm ghost">Cerrar</button></div>
    <pre id="summary-md"></pre>
  </aside>

  <script src="/player.js"></script>
  <script src="/lab/lab.js"></script>
  <script src="/lab/lab_foto.js"></script>
</body>
</html>
